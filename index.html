
<!DOCTYPE html>
<html>
	<head>
		<title>Book Arranger</title>
		<link rel="stylesheet" href="main.css">
		

		<script type="module">

			import { Placement } from './components/Placement.js'
			import { PatternPage } from './components/PatternPage.js'

			import { measurements, convert } from './js/measurements.js'
			import { rearrange_pdf } from './js/processPdf.js'

			import { PDFDocument } from "./lib/pdf-lib.esm.min.js"
			import { download } from './lib/download2.js'

			// Set default page to landscape a4
			document.querySelector("#new-page-width").value = measurements.a4.height
			document.querySelector("#new-page-height").value = measurements.a4.width

			// Set default source page to portrait a5
			document.querySelector("#source-page-width").value = measurements.a5.width
			document.querySelector("#source-page-height").value = measurements.a5.height

			customElements.define("pattern-page", PatternPage);
			customElements.define("arranger-placement", Placement);

			const getAllPlacements = () => {
				
				let allPlacements = [];

				const e = document.querySelector("#pattern-preview")

				for (const page of e.children) {
					const placements = page.shadowRoot.querySelector(".preview-page").children

					for (const placement of placements) {
						allPlacements.push(placement);
					}
					
				}

				return allPlacements;
				
			}

			/** Button Methods */
			window.addPage = () => {

				const pageWidth = document.querySelector("#new-page-width").value;
				const pageHeight = document.querySelector("#new-page-height").value;

				const pattern_page = document.createElement("pattern-page");
				pattern_page.setAttribute('width', pageWidth);
				pattern_page.setAttribute('height', pageHeight);

				document.querySelector("#pattern-preview").appendChild(pattern_page);

				return pattern_page;
				
			}


			window.updatePlacementWidths = (newWidth) => {
				const placements = getAllPlacements();

				for (const placement of placements) {
					placement.setAttribute('width', newWidth);
				}
			}

			window.updatePlacementHeights = (newHeight) => {
				const placements = getAllPlacements();

				for (const placement of placements) {
					placement.setAttribute('height', newHeight);
				}
			}

			window.setPlacementSize = (pageSize) => {
				window.updatePlacementWidths(measurements[pageSize].width)
				window.updatePlacementHeights(measurements[pageSize].height)

				document.querySelector('#source-page-width').value = measurements[pageSize].width
				document.querySelector('#source-page-height').value = measurements[pageSize].height
			}


			/** Generate */
			const extract_arrangement_pattern = () => {
				let arrangement_pattern = {
					pages: []
				}

				const patternPages = document.querySelectorAll("pattern-page");


				for (const page of patternPages) {
					const new_page = {
						tiles: [],
						width: parseInt(page.getAttribute('width')),
						height: parseInt(page.getAttribute('height')),
					}

					const placements = page.shadowRoot.querySelectorAll("arranger-placement")

					for (const placement of placements) {
						const start = parseInt(placement.shadowRoot.querySelector("#placement-source-start").value)
						const skip = parseInt(placement.shadowRoot.querySelector("#placement-source-skip").value)
						new_page.tiles.push({
							start: start,
							skip: skip,
							iteration: 0,
							position: {
								x: parseInt(placement.getAttribute('data-x')),
								y: parseInt(placement.getAttribute('data-y'))
							}
						})
					}

					arrangement_pattern.pages.push(new_page)
				}

				return arrangement_pattern;
			}


			let loaded_doc = null;

			window.newFile = (event) => {
			     const reader = new FileReader();

			     reader.onloadend = (load_res) => {
			    		
					console.log(load_res);
			    
			       if (!reader.result) return;
			    
			       PDFDocument.load(reader.result).then(pdf_res => {
					 loaded_doc = pdf_res;
					 console.log("Loaded");
					document.querySelector("#rearrange-pdf-btn").disabled=false
			       });
			    
			    
			     }

			     console.log(event.target.files)
			     reader.readAsDataURL(event.target.files[0]);
			    
			}

			window.generate_booklet_pattern = () => {
				const pages_per_section = document.querySelector('#bg-pages-per-section').valueAsNumber;
				if (isNaN(pages_per_section)) { return; }

				let booklet_pattern = {
					pages: []
				}

				const page_width = document.querySelector('#new-page-width').valueAsNumber;
				const page_height = document.querySelector('#new-page-height').valueAsNumber;
				for (let i=0; i<(pages_per_section/2); i+=1) {
					const new_page = {
						tiles: [],
						width: page_width,
						height: page_height,
					}

					console.log(i%2)

					new_page.tiles.push({
						start: i+1,
						skip: pages_per_section-1,
						iteration: 0,
						position: {
							x: (i%2 === 0) ? page_width/2 : 0,
							y: 0,
						}
					})

					new_page.tiles.push({
						start: pages_per_section-i,
						skip: pages_per_section-1,
						iteration: 0,
						position: {
							x: (i%2 === 0) ? 0 : page_width/2,
							y: 0,
						}
					})

					booklet_pattern.pages.push(new_page);
				}

				console.log("Generated Booklet Pattern", booklet_pattern)
				
				window.load_pattern(booklet_pattern);
			}

			window.generate = () => {
				if (loaded_doc === null) {
					console.log("No loaded doc!");
					return;
				}
				const pattern = extract_arrangement_pattern();

				console.log(pattern);

				rearrange_pdf(loaded_doc, pattern);
			}

			window.save_pattern = () => {

				const pattern = extract_arrangement_pattern();
				const pattern_json = JSON.stringify(pattern)

    			download(pattern_json, 'pattern.json', 'application/json')
			}

			window.load_pattern = (pattern) => {
				for (const page of pattern.pages) {
					const new_page = window.addPage()
					for (const tile of page.tiles) {
						const new_placement = new_page.addPlacement()
						new_placement.setAttribute('data-x', tile.position.x)
						new_placement.setAttribute('data-y', tile.position.y)
						new_placement.setAttribute('data-start', tile.start)
						new_placement.setAttribute('data-skip', tile.skip)
					}
				}
			}

		</script>

	</head>
	<body>

		<template id="preview-page">
		</template>

		<nav>
			<div style="flex-grow: 1">
				<!-- Pattern Controls -->
				<section class="padded-section"> 
					<button onClick="save_pattern()">Save Pattern</button>
					<button disabled>Load Pattern</button>
				</section>

				<!-- Page Controls -->
				<details open>
					<summary><strong>Page</strong></summary>

					<div class="two-col-settings">
						<label for="new-page-width">New Page Width</label> <input type="number" value="" id="new-page-width" />
						<label for="new-page-height">New Page Height</label> <input type="number" value="" id="new-page-height" />

						<div style="grid-column: span 2;">
							<button disabled>A4</button>
							<button disabled>Letter</button>
						</div>

						<div style="grid-column: span 2;">
							<button style="width: 100%" onclick="addPage()">Add Page</button>
						</div>


					</div>

				</details>

				<!-- Source Controls -->
				<details open>
					<summary><strong>Source PDF Settings</strong></summary>

					<div class="two-col-settings">
						<label for="source-page-width">Source Page Width</label>
						<input type="number" value="400" id="source-page-width" onChange="updatePlacementWidths(event.target.value)">

						<label for="source-page-height">Source Page Height</label>
						<input type="number" value="400" id="source-page-height" onChange="updatePlacementHeights(event.target.value)">

						<div style="grid-column: span 2;">
							<button onClick="setPlacementSize('a5')">A5</button>
							<button disabled>Letter</button>
						</div>
					</div>

				</details>

				<!-- Booklet Generator -->
				<details>
					<summary><strong>Booklet Generator</strong></summary>

					<div class="two-col-settings">
						<label for="bg-pages-per-section">Pages per Section</label>
						<input type="number" value="20" id="bg-pages-per-section" >

						<div style="grid-column: span 2;">
							<button style="width: 100%" onClick="generate_booklet_pattern()">Generate Booklet Pattern</button>
						</div>

					</div>
				</details>
			</div>

			<!-- PDF Source & Generate Controls  -->
			<section class="padded-section" style="border-bottom: none; border-top: solid 1px var(--bg-lightest)"> 
				<input type="file" onChange="newFile(event)">
				<!-- Gets enabled when a file is loaded -->
				<button disabled id="rearrange-pdf-btn" style="width: 100%; height: 3em; margin-top: var(--gap-small)"  onClick="generate()">Rearrange PDF</button>
			</section>
		</nav>

		<main>
			


			<!-- Where new pages get added -->
			<section id="pattern-preview">
			</section>

			<!-- TODO: manual icon in bottom left -->

		</main>


	</body>
</html>
